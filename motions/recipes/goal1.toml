[motions.advance_lunge_cut]
reproduces = "advance_lunge_cut_v5"
source = "motion:advance_lunge"
allow_warn = true
tied_to_mediapipe = [
  "The cut lands at the lunge touchdown detected on the base (recipes.lunge_timing: 3.10 s on the MediaPipe base), so it follows a new base without a hand-set time. Check the key time in the report; `hit_at_s = <s>` on the step overrides it.",
]
[[motions.advance_lunge_cut.steps]]
op = "blade"
recipe = "advance_lunge_cut"
cut = "cut_head"
