[project]
name = "humanoid-fencing"
version = "0.1.0"
description = "Glue code for the Humanoid Combat Fencing project: video -> G1 motion -> mjlab policy"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "mujoco~=3.11.0",            # match mjlab v1.6.0
  "opencv-python-headless>=4.9",
  "yt-dlp[default]>=2025.10.0",
  "pyyaml>=6.0",
  "onnxruntime>=1.19",
  "tqdm>=4.66",
]

[project.scripts]
fencing = "fencing.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fencing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs internet (deselect with -m 'not network')",
  "gpu: needs an NVIDIA GPU",
  "slow: takes more than ~30 s",
]

[tool.ruff]
line-length = 100
target-version = "py311"
